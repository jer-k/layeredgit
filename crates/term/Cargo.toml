[package]
name = "term"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
# Cargo ignores SemVer build metadata in requirements. Cargo.lock pins 0.9.0+ghostty-vt.1.0.1.
ghostty-vt = { version = "=0.9.0", default-features = false }
percent-encoding = "2.3.2"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
