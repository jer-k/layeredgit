<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>layeredgit · Stacked Sheets (blue and gold)</title>
  <defs>
    <path id="tile" d="M356 100H668C853 100 924 171 924 356V668C924 853 853 924 668 924H356C171 924 100 853 100 668V356C100 171 171 100 356 100Z"/>
    <linearGradient id="shell" x2=".8" y2="1">
      <stop stop-color="#3d5f86"/>
      <stop offset="1" stop-color="#1d2f47"/>
    </linearGradient>
    <linearGradient id="rim" x2="0" y2="1">
      <stop stop-color="#c9dcf2" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7f9fc4" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="committed" x2=".85" y2="1">
      <stop stop-color="#7fb0c2"/>
      <stop offset="1" stop-color="#5a8c9d"/>
    </linearGradient>
    <linearGradient id="working" x2=".85" y2="1">
      <stop stop-color="#fee27e"/>
      <stop offset="1" stop-color="#e9b93f"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.4">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <!-- The optical grid is 824 × 824; only the soft shadow extends beyond it. -->
  <use href="#tile" transform="translate(0 20)" fill="#060D1A" opacity=".37" filter="url(#shadow)"/>
  <use href="#tile" fill="url(#shell)" stroke="url(#rim)" stroke-width="4"/>
  <rect x="236" y="343" width="576" height="416" rx="102" fill="#050D1E" opacity=".44" filter="url(#shadow)"/>
  <rect x="246" y="348" width="580" height="407" rx="98" fill="url(#committed)"/>
  <rect x="206" y="293" width="582" height="407" rx="98" fill="#0d1a2b" opacity=".35" filter="url(#shadow)"/>
  <rect x="198" y="269" width="582" height="420" rx="98" fill="url(#working)" stroke="#fff3c4" stroke-opacity=".45" stroke-width="5"/>
  <path transform="translate(496 479) scale(1.105 1.17) translate(-496 -479)" fill="#2b4462" d="M271 354H348V533H453V604H271Z
